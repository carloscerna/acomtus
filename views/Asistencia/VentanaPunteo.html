<style>

    .opcion-card {
        cursor: pointer;

        transition: all 0.2s;
        margin-bottom: 10px;
        background: #f9f9f9;
    }
    .opcion-card:hover { background: #e0e0e0; }
    .opcion-card.active {
        border-color: #007bff;
        background-color: #e7f1ff;
        font-weight: bold;
        color: #0056b3;
    }
    .seccion-titulo { font-size: 0.9rem; color: #666; margin-bottom: 5px; font-weight: bold; text-transform: uppercase; border-bottom: 1px solid #eee;}
    .fila-grid { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; }

                    <div class="mt-3 p-2 alert alert-secondary text-center small" style="border: 1px dashed #999;">
